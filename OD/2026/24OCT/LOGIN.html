<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Days Research — 11 October wireframes prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceef1;--panel:#ffffff;--ink:#1d1f23;--muted:#62666e;--line:#d9dce1;--hover:#f2f3f6;--accent:#50378c;--accent-soft:#ede7f6;--hot:#1f6feb;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--panel:#202226;--ink:#e8e9ec;--muted:#9a9ea7;--line:#34373d;--hover:#2a2c31;--accent:#b9a5ec;--accent-soft:#2d2640;--hot:#5b9bff}}
:root[data-theme="dark"]{--bg:#17181b;--panel:#202226;--ink:#e8e9ec;--muted:#9a9ea7;--line:#34373d;--hover:#2a2c31;--accent:#b9a5ec;--accent-soft:#2d2640;--hot:#5b9bff}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:268px minmax(0,1fr) 300px;height:100%}
nav.toc{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 0 32px}
.toc h1{font-size:15px;font-weight:700;margin:0 20px 2px}
.toc .sub{color:var(--muted);font-size:12.5px;margin:0 20px 18px}
.toc details{border-top:1px solid var(--line)}
.toc summary{cursor:pointer;list-style:none;padding:12px 20px;font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.toc summary::-webkit-details-marker{display:none}
.toc summary::after{content:"+";color:var(--muted);font-weight:400}
.toc details[open] summary::after{content:"–"}
.toc ol{list-style:none;margin:0 0 10px;padding:0}
.toc button{all:unset;box-sizing:border-box;display:flex;gap:10px;width:100%;padding:6px 20px 6px 20px;cursor:pointer;font-size:13px;color:var(--ink)}
.toc button .code{color:var(--muted);min-width:44px;font-variant-numeric:tabular-nums}
.toc button:hover{background:var(--hover)}
.toc button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.toc button[aria-current="true"] .code{color:var(--accent)}
.toc button:focus-visible,.bar button:focus-visible,.hs:focus-visible,.links button:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .title{font-weight:600;font-size:14px;margin-right:auto;min-width:0}
.bar .title span{color:var(--muted);font-weight:400}
.bar button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer}
.bar button:hover:not(:disabled){background:var(--hover)}
.bar button:disabled{opacity:.4;cursor:default}
.bar button[aria-pressed="true"]{border-color:var(--hot);color:var(--hot)}
.bar select{display:none;font:inherit;font-size:13px;max-width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.stage{flex:1;overflow:auto;padding:24px;min-height:0}
.fit{margin:0 auto;position:relative}
.frame{position:absolute;left:0;top:0;width:1440px;transform-origin:0 0;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 28px rgba(0,0,0,.08);font-family:Inter,system-ui,sans-serif;color:#1a1a1a}
.frame .n{position:absolute;box-sizing:border-box}
.frame .t{position:absolute;line-height:1.21;white-space:pre-wrap;overflow-wrap:break-word}
.hs{position:absolute;display:block;border:0;padding:0;margin:0;background:transparent;cursor:pointer;border-radius:4px;z-index:5}
.hs:hover{background:rgba(31,111,235,.07)}
.show .hs,.flash .hs{background:rgba(31,111,235,.14);box-shadow:inset 0 0 0 2px rgba(31,111,235,.7)}
.flash .hs{transition:background .15s}
aside.info{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:20px 20px 40px}
.info h2{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 4px}
.info .jt{font-size:15px;font-weight:700;margin:0 0 6px}
.info p{margin:0 0 14px;color:var(--ink)}
.info .jd{color:var(--muted);font-size:13px}
.info hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.note{border-radius:8px;padding:12px 14px;margin:0 0 12px;font-size:13px;border:1px solid}
.note strong{display:block;margin-bottom:4px}
.note.warm{background:#fff8eb;border-color:#f0d7aa;color:#6e4e14}
.note.cool{background:#f6f3fc;border-color:#c9bee2;color:#45307e}
.note p{margin:0 0 6px;color:inherit}
.links{list-style:none;margin:0;padding:0}
.links li{margin:0 0 2px}
.links button{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.links button:hover{background:var(--hover)}
.links button span:last-child{color:var(--muted);white-space:nowrap}
.hint{color:var(--muted);font-size:12.5px}
kbd{font:inherit;font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
@media (max-width:1180px){.app{grid-template-columns:240px minmax(0,1fr)}aside.info{grid-column:2;border-left:0;border-top:1px solid var(--line)}.app{grid-template-rows:1fr auto;height:auto;min-height:100%}main{height:100vh;height:100dvh}}
@media (max-width:820px){.app{display:block}nav.toc{display:none}.bar select{display:block;flex-basis:100%}.bar .title{display:none}main{height:auto}.stage{padding:12px;overflow:visible}aside.info{border-top:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.app{grid-template-columns:var(--lw,268px) minmax(0,1fr) var(--rw,300px);transition:grid-template-columns .2s ease}
.app.l-off{--lw:0px}.app.r-off{--rw:0px}
nav.toc,aside.info{overflow-x:hidden}
.toc-inner{width:268px}.info-inner{width:300px;padding:20px 20px 40px}
aside.info{padding:0}
.app.l-off nav.toc{border-right-color:transparent}.app.r-off aside.info{border-left-color:transparent}
.bar .tog{display:inline-flex;align-items:center;gap:6px}
.bar .tog svg{width:15px;height:15px}
.bar .tog[aria-expanded="false"]{color:var(--muted)}
.frame .layer{position:absolute;left:0;top:0;width:100%;height:100%}
.frame .pn,.frame .hsl{pointer-events:none}
.frame .pn>*,.frame .hsl>*{pointer-events:auto}
.frame .bd{cursor:pointer}
.frame .hsl{z-index:5}
.fin{position:absolute;border:0;background:transparent;font-family:Inter,system-ui,sans-serif;color:#1a1a1a;outline:none;border-radius:6px}
.fin::placeholder{color:#969696;opacity:1}
.fin:focus-visible{box-shadow:0 0 0 3px rgba(80,55,140,.35)}
.fbtn{position:absolute;border:0;border-radius:20px;background:#1a1a1a;color:#fff;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
.fbtn:focus-visible{outline:3px solid rgba(80,55,140,.5);outline-offset:2px}
.busy{position:absolute;display:flex;align-items:center;justify-content:center;gap:10px;background:#1a1a1a;color:#fff;font:600 15px Inter,system-ui,sans-serif;border-radius:26px;z-index:6}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{position:absolute;left:160px;top:310px;width:1120px;font-family:Inter,system-ui,sans-serif;color:#6b6b6b}
.loading .row{display:flex;align-items:center;gap:12px;font-size:16px;margin-bottom:22px;color:#553c91}
.loading .sk{height:10px;border-radius:5px;background:linear-gradient(90deg,#ececf0 0%,#f6f6f9 50%,#ececf0 100%);background-size:200% 100%;animation:sh 1.1s linear infinite;margin-bottom:14px}
@keyframes sh{to{background-position:-200% 0}}
.caret{display:inline-block;width:2px;height:1em;background:#553c91;vertical-align:-2px;margin-left:2px;animation:bl .9s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.frame .n{transition:background-color .15s ease,border-color .15s ease}
.trayw{position:absolute;left:0;top:1090px;width:1440px;height:110px}
.trayh{position:absolute;left:0;top:1090px;width:1440px;height:110px;pointer-events:none}
.trayh>*{pointer-events:auto}
.hs:disabled{cursor:not-allowed}
@media (max-width:1180px){.app{grid-template-columns:var(--lw,240px) minmax(0,1fr)}.app.r-off aside.info{display:none}.toc-inner{width:240px}.info-inner{width:auto}}
@media (max-width:820px){#tl{display:none}}
@media (prefers-reduced-motion:reduce){.app{transition:none}.spin,.sk,.caret{animation:none!important}}

</style>
</head>

T|17|17|1406|21|553c91||0|14|B|L|Rate limiting the generative answer, not the search
T|17|44|1406|126|553c91||0|14|R|L|Small print under the input, borrowed from the pattern Reddit uses on its answers box. It does two jobs at once: it protects the token spend, and it gives the login prompt a concrete reason that is true — logged-in users get a higher allowance because we can attribute usage to a person rather than an IP address.\\n\\nThree things to hold onto. The cap is on the AI answer, not on search: traditional results stay unlimited for everyone, or we have built a paywall in front of public university information. The counter has to be visible before the user spends one, not only when they run out. And bots are the real budget risk, not people — a per-session counter alone will not stop them, so this needs pairing with server-side rate limiting by IP and a bot check on the generative endpoint.

const SECT=`#74:724|A — Search without logging in|The baseline. Everything here must work for someone who never signs in, because most people never will.
60|A1a  Homepage|Search bar is visible and prominent. Header offers log in, nothing demands it.
1700|A1b  Search overlay opens|Lightbox over the page. Logged out there is no history to show, so the space goes to popular searches and categories.
3340|A1c / A1d  Results, AI snippet first|Generative snippet sits above traditional results. Nothing is saved — this search leaves no trace.
4980|A1e-i  Full /search listing page|Same AI snippet, same results, plus filters. Facets per the Confluence decision: Category, Location, Sort by.
6620|A1e-ii  Destination page|Reached from a traditional result or from a citation inside the AI snippet. Journey A ends here.
#74:1062|B — Search when already logged in|Same journey as A, plus persistence. Searches are written to history and saved items become possible.
60|B1a  Homepage, logged in|Only the header changes. The page itself is not personalised at this stage — that is a later decision, not a search one.
1700|B1b  Overlay opens — history is there|Recent searches take the top slot. Each row is removable — a history you cannot edit is a liability.
3340|B1c / B1d  Results — and the search is kept|Identical to A1c/d apart from the saved confirmation and the Save control on each result.
4980|B1e-i  Full /search listing page|Adds 'Save this search' — a named, re-runnable search, which is different from history.
6620|B1e-ii  Destination page|The bookmark now has somewhere to go, and shows a real saved state.
#74:1414|C — Logging in part-way through a search|The interesting one. The user arrives anonymous, is offered a reason to log in at the moment it would help, and carries on. Both C variants you wrote are covered: starting a new search, and re-running a previous one.
60|C2a  Homepage, logged out|Identical to A1a. Nothing has been asked of the user yet.
1700|C2b  The offer to log in|One line, one reason, dismissible. It sits in the space journey B fills with history — so the slot earns its keep either way.
3340|C2b-ii  Login|Social or site login. Shared component — the same modal is used from the header, from search, and from any component that prompts.

 if(e.key==='Escape'){if(BASE[current?.code]){e.preventDefault();closeOverlay()}return}
 if(e.target.closest('input,select,textarea')||e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else if(e.key==='h'||e.key==='H')$('hot').click();
 else if(e.key==='[')$('tl').click();else if(e.key===']')$('tr').click();
 else if(e.key==='Backspace'){e.preventDefault();$('back').click()}});
addEventListener('resize',layout);
buildToc();
const start=decodeURIComponent(location.hash.slice(1));go(byCode[start]?start:'A1a',false);
</script>
</body>
</html>
